[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event2vector"
version = "0.3.0"
description = "Scikit-learn-style geometric embeddings for event sequences."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
  { name = "Antonin Sulc" }
]

keywords = [
  "sequence-embedding",
  "event-sequences",
  "representation-learning",
  "word2vec",
  "scikit-learn",
  "time-series"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research"
]

dependencies = [
  "numpy>=1.21",
  "torch>=1.13",
  "scikit-learn>=1.0",
  "tqdm>=4.0"
]

[project.optional-dependencies]
viz = [
  "matplotlib",
  "seaborn"
]

manifold = [
  "openTSNE"
]

nlp = [
  "gensim"
]

# Optional Riemannian optimization for the hyperbolic model (geoopt).
hyperbolic = [
  "geoopt>=0.5"
]

dev = [
  "pytest",
  "black",
  "ruff"
]

[project.urls]
Homepage = "https://github.com/sulcantonin/event2vec_public"
Repository = "https://github.com/sulcantonin/event2vec_public"
Issues = "https://github.com/sulcantonin/event2vec_public/issues"

[tool.setuptools.packages.find]
include = ["event2vector*"]
